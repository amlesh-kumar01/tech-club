version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: techclub_frontend
    ports:
      - "3001:3000"
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=techclub_access_key
      - S3_SECRET_KEY=techclub_secret_key
      - S3_BUCKET_NAME=techclub-media
    depends_on:
      - minio

  minio:
    image: minio/minio:latest
    container_name: techclub_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=techclub_access_key
      - MINIO_ROOT_PASSWORD=techclub_secret_key
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: techclub_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 techclub_access_key techclub_secret_key;
      mc mb local/techclub-media || true;
      mc anonymous set public local/techclub-media;
      exit 0;
      "

volumes:
  minio_data:
